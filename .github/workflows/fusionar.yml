name: Fusionar notas (Gemini)

# Fusiona con Gemini las fichas de fuente de cada entidad en una nota maestra
# (notas-tecnicas/generador/fusionar.py). Se lanza a mano: Actions → este
# workflow → Run workflow. Usa la key del profesor, secreto GEMINI_API_KEY.
# Lo que no pasa la auditoría de datos se queda en maestras/pendientes/.

on:
  workflow_dispatch:
    inputs:
      entidades:
        description: 'Entidades separadas por espacios (vacío = usar «todas»)'
        required: false
        default: ''
      todas:
        description: 'Todas las entidades con 2 o más fuentes'
        type: boolean
        default: false
      max:
        description: 'Como mucho N entidades en esta ejecución'
        default: '10'
      modelo:
        description: 'Modelo de Gemini («auto» = el Flash más nuevo disponible)'
        default: 'auto'
      forzar:
        description: 'Rehacer aunque las fuentes no hayan cambiado (p. ej. para colocar los huecos de imagen)'
        type: boolean
        default: false
      probar:
        description: 'Solo probar la configuración (key y modelo), sin fusionar'
        type: boolean
        default: false

concurrency:
  group: notas-tecnicas      # la misma cola que la regeneración: nunca a la vez
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fusionar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: 'notas-tecnicas'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install --quiet -r generador/requirements.txt google-genai pydantic
      - name: Fusionar
        id: fusion
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FUSION_MODELO: ${{ inputs.modelo }}
          ENTIDADES: ${{ inputs.entidades }}
          TODAS: ${{ inputs.todas }}
          MAX: ${{ inputs.max }}
          PROBAR: ${{ inputs.probar }}
          FUSION_FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: |
          if [ "$PROBAR" = "true" ]; then
            python3 generador/fusionar.py --probar
          elif [ "$TODAS" = "true" ]; then
            python3 generador/fusionar.py --todas --max "$MAX"
          else
            python3 generador/fusionar.py --max "$MAX" $ENTIDADES
          fi
      # Los push de GITHUB_TOKEN no disparan otro workflow: se regenera aquí.
      # Solo se guardan las maestras; web/ se regenera sobre el main más reciente
      # para no chocar con lo que sube la extensión mientras se fusiona.
      - name: Guardar
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CAMBIOS=$(git ls-files -mo --exclude-standard notas-tecnicas/maestras)
          [ -z "$CAMBIOS" ] && { echo "::notice::Nada que guardar."; exit 0; }
          tar -cf "$RUNNER_TEMP/maestras.tar" $CAMBIOS
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            tar -xf "$RUNNER_TEMP/maestras.tar"
            (cd notas-tecnicas && python3 generador/construir.py > /dev/null)
            git add -A notas-tecnicas
            git commit -qm "Fusión: maestras nuevas o actualizadas" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Resultado
        if: steps.fusion.outcome == 'failure'
        run: |
          echo "::error::Alguna entidad no se ha fusionado: mira el paso «Fusionar»."
          exit 1
