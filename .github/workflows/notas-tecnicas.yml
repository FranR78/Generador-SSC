name: Regenerar notas técnicas

# Flujo: subo un .md de NotebookLM (o capturas) → GitHub lo importa y rehace el HTML.
#
# No hay que ejecutar nada en el PC. Todo lo que hay que hacer es dejar archivos
# en su carpeta, dentro de "notas-tecnicas/":
#
#   entrada/      un .md copiado de NotebookLM → se importa y se archiva
#                 en entrada/procesados/
#   imagenes/     las capturas del alumnado (NT21_01.jpg) → se incrustan
#   notas/        las fichas ya importadas, por si hay que retocarlas a mano
#
# El resultado (web/notas-tecnicas.html y .txt) lo vuelve a commitear este mismo
# workflow. Los push que hace GITHUB_TOKEN no disparan otro workflow, así que no
# se reengancha solo.

on:
  push:
    branches: [main]
    paths:
      - 'notas-tecnicas/entrada/**'
      - 'notas-tecnicas/notas/**'
      - 'notas-tecnicas/maestras/**'
      - 'notas-tecnicas/imagenes/**'
      - 'notas-tecnicas/generador/**'
      - '.github/workflows/notas-tecnicas.yml'
  workflow_dispatch:

concurrency:
  group: notas-tecnicas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    # El nombre de la carpeta lleva espacio y tilde, así que va entrecomillado
    # en todas partes. Sin las comillas, cada orden lo parte en dos.
    defaults:
      run:
        working-directory: 'notas-tecnicas'
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet -r generador/requirements.txt

      - name: Importar lo que haya en entrada/
        run: python3 generador/procesar_entrada.py

      - name: Auditar las notas maestras (ningún dato perdido)
        run: |
          for f in maestras/*.md; do
            [ -e "$f" ] || continue
            python3 generador/auditar_fusion.py "$f" || echo "::warning::$f ha perdido datos de sus fuentes: revísala"
          done

      - name: Comprobar las fichas antes de generar nada
        run: python3 generador/construir.py --validar

      - name: Generar el HTML
        run: python3 generador/construir.py

      - name: Guardar el resultado
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'notas-tecnicas'
          if git diff --cached --quiet; then
            echo "::notice::Nada que actualizar."
            exit 0
          fi
          git commit -m "Notas técnicas: regenerar tras los últimos cambios"
          # La extensión sube el siguiente PDF mientras esto trabaja: el push
          # choca («fetch first»). Se integra lo nuevo y se reintenta. Lo que
          # llega solo añade archivos en entrada/, así que el rebase no choca.
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase origin main || exit 1
          done
          exit 1
