# Trae a este repositorio el código de un proyecto de Apps Script.
#
# Para qué: el código de un script ligado a una hoja de cálculo no se puede
# leer desde fuera del editor. Esto lo baja y lo commitea, y a partir de ahí
# ya se puede revisar, comparar y desplegar como todo lo demás.
#
# No toca el proyecto de Google: solo lee.

name: Descargar Apps Script

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: 'ID de secuencia (editor → Configuración del proyecto)'
        required: true
      destino:
        description: 'Carpeta donde dejarlo, p. ej. apps-script/mihoja'
        required: true

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el destino
        run: |
          D="${{ inputs.destino }}"
          case "$D" in
            /*|*..*) echo "::error::Destino no válido: '$D'."; exit 1 ;;
          esac
          if [[ -e "$D" ]]; then
            echo "::error::'$D' ya existe. Elige otra carpeta o bórrala antes."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @google/clasp@2.4.2

      - name: Credenciales
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "::error::Falta el secreto CLASPRC_JSON."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Clonar el proyecto
        run: |
          mkdir -p "${{ inputs.destino }}"
          clasp clone "${{ inputs.script_id }}" --rootDir "${{ inputs.destino }}"
          # El .clasp.json lo genera el workflow de despliegue; aquí estorba.
          rm -f .clasp.json "${{ inputs.destino }}/.clasp.json"

      - name: Commitear
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ inputs.destino }}"
          if git diff --cached --quiet; then
            echo "El proyecto no trae nada nuevo."
            exit 0
          fi
          git commit -m "apps-script: descargar el proyecto en ${{ inputs.destino }}"
          git push
