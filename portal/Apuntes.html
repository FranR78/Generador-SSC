<!-- Apuntes.html — Las notas técnicas dentro del portal.
     Leer NO gasta consultas: si no hay libros, esto es el libro. -->
<style>
  .ap .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .ap input[type=search]{flex:1;min-width:180px;padding:9px 11px;border:1px solid var(--borde);
    border-radius:8px;font-family:inherit;font-size:14px}
  .ap select{padding:9px 11px;border:1px solid var(--borde);border-radius:8px;font-family:inherit;font-size:14px}
  .ap .lista{display:grid;gap:6px}
  .ap .ap-seccion{margin:14px 0 2px;padding:6px 10px;font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;color:#fff;
    background:var(--azul,#0a63aa);border-radius:8px}
  .ap .ap-seccion:first-child{margin-top:0}
  /* Itinerario del curso: secciones plegables con su progreso. */
  .ap details.itin{border:1px solid var(--borde);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
  .ap details.itin>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:11px 12px;background:#eef5fb;font-weight:700;color:var(--azul-os,#063f70);font-size:13.5px}
  .ap details.itin>summary::-webkit-details-marker{display:none}
  .ap details.itin>summary::before{content:'▸';color:var(--azul,#0a63aa);font-weight:700}
  .ap details.itin[open]>summary::before{content:'▾'}
  .ap .itin-tit{flex:1}
  .ap .itin-prog{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#5a6b78;white-space:nowrap}
  .ap .itin-barra{width:54px;height:7px;background:#d7e6f2;border-radius:20px;overflow:hidden}
  .ap .itin-barra>span{display:block;height:100%;background:var(--azul,#0a63aa);border-radius:20px}
  .ap details.itin>.nt{margin:6px 8px}
  .ap details.itin>.nt:first-of-type{margin-top:8px}
  .ap .nt{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;
    background:#fff;border:1px solid var(--borde);border-radius:9px;padding:10px 12px;
    cursor:pointer;font-family:inherit;font-size:14px}
  .ap .nt:hover{border-color:var(--azul,#0a63aa);background:#f3f9ff}
  .ap .nt .num{font-weight:800;color:var(--azul-os,#063f70);min-width:46px}
  .ap .nt .tit{flex:1}
  .ap .nt small{display:block;color:#5a6b78;font-size:12px;margin-top:2px}
  .ap .nt .ok{color:#1e874b;font-weight:700;font-size:12px;white-space:nowrap}
  .ap .nt.leida{background:#f6fbf8}
  .ap .chip{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;
    padding:1px 7px;border:1px solid var(--borde);color:#5a6b78;background:#eef4f9}
  .ap .chip.proceso{background:#e8f6f2;color:#0a7a6d;border-color:#b8e0d6}
  .ap .lector h2{margin-top:0}
  .ap .apartado{margin:14px 0;padding-left:12px;border-left:3px solid var(--azul,#0a63aa)}
  .ap .apartado h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--azul-os,#063f70);margin:0 0 4px}
  .ap .apartado p{margin:0;line-height:1.6;font-size:14.5px}
  .ap .fuente{font-size:12px;color:#5a6b78;border-top:1px solid var(--borde);padding-top:8px;margin-top:14px}
  .ap .vacio{color:#5a6b78;font-style:italic;font-size:14px}
  .ap .curso-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
  .ap .volver-curso{background:var(--azul,#0a63aa);color:#fff;border:none;border-radius:8px;
    padding:7px 12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .ap .curso-et{font-size:13px;color:#5a6b78}
  .ap .curso-et strong{color:var(--azul-os,#063f70)}
  /* Dentro de un curso el desplegable de unidad no tiene sentido: la unidad la
     fija el curso. Se oculta para que el alumno no se salga sin querer. */
  .ap.en-curso #ap-unidad{display:none}

  /* Móvil: una cosa cada vez. La nota sustituye a la lista. */
  .ap #ap-lector{display:none}
  .ap.leyendo #ap-lista{display:none}
  .ap.leyendo #ap-lector{display:block}

  /* PC: en una pantalla de 1280 sobraba medio monitor y cada nota obligaba a
     ir y volver. Con las dos columnas se lee una nota sin perder de vista la
     lista, que es como se estudia de verdad: saltando entre notas. */
  @media (min-width: 1000px){
    .ap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:14px;align-items:start}
    .ap #ap-lista{position:sticky;top:60px}
    .ap #ap-lista .lista{max-height:calc(100vh - 260px);overflow-y:auto;padding-right:4px}
    .ap #ap-lector{display:block}
    .ap.leyendo #ap-lista{display:block}   /* aquí caben las dos: no se esconde */
    .ap #ap-volver{display:none}       /* no hay de dónde volver: la lista está ahí */
    .ap .nt.abierta{border-color:var(--azul-osc);background:#eaf4fe;
      box-shadow:inset 3px 0 0 var(--azul-osc)}
    .ap .apartado p{font-size:15px;max-width:72ch}   /* renglones legibles */
  }
</style>

<div class="ap">
  <div id="ap-lista">
    <div class="panel">
      <div id="ap-curso" class="curso-cab" hidden>
        <button id="ap-salir-curso" class="volver-curso">← Todos los cursos</button>
        <span class="curso-et">Estás en: <strong id="ap-curso-nom"></strong></span>
      </div>
      <h2>Apuntes</h2>
      <p class="aviso" id="ap-resumen">Cargando apuntes…</p>
      <div class="barra">
        <input type="search" id="ap-buscar" placeholder="Buscar: compresor, subenfriamiento, G65…">
        <select id="ap-unidad"><option value="">Todas las unidades</option></select>
        <select id="ap-grupo"><option value="">Todos los temas</option></select>
        <select id="ap-filtro">
          <option value="">Todas</option>
          <option value="no">Sin leer</option>
          <option value="si">Ya leídas</option>
        </select>
      </div>
      <div class="lista" id="ap-resultados"></div>
    </div>
  </div>

  <div id="ap-lector">
    <div class="panel lector">
      <button class="accion sec" id="ap-volver" style="margin-bottom:10px">← Volver a los apuntes</button>
      <div id="ap-nota"><p class="vacio">Elige una nota de la lista para leerla aquí.</p></div>
    </div>
  </div>
</div>
