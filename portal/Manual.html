<div class="panel">
  <h2>Tu participación</h2>
  <div id="manual-estado" class="estado">…</div>
  <p class="aviso" style="margin-top:6px">Responde tareas y valora respuestas de tus compañeros para desbloquear más consultas y construir el manual entre todos.</p>
</div>

<div class="panel">
  <h2>Responde una tarea</h2>
  <form id="form-aporta">
    <select id="aporta-tarea" style="width:100%; padding:9px 11px; border:1px solid var(--borde); border-radius:8px; font-size:14px; margin-bottom:8px;">
      <option value="">Cargando tareas…</option>
    </select>
    <textarea id="aporta-texto" placeholder="Escribe tu respuesta con tus palabras (mín. 15 caracteres)…" style="width:100%; min-height:80px;"></textarea>
    <div style="margin-top:8px;"><button type="submit" class="accion">Enviar respuesta</button></div>
  </form>
  <div id="aporta-estado" class="estado"></div>
</div>

<div class="panel">
  <h2>Valora respuestas de otros</h2>
  <div id="valorar-lista"><div class="placeholder">Cargando…</div></div>
</div>
