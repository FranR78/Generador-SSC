<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #038df1;
      --azul-osc: #026bb5;
      --fondo: #E8F0F3;
      --borde: #d3dee4;
      --texto: #10222c;
      --ok: #1e874b;
      --err: #8a1f11;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Open Sans', Arial, sans-serif; background: var(--fondo); color: var(--texto); }

    header {
      background: var(--azul-osc); color: #fff;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    header .marca h1 { font-size: 16px; margin: 0; font-weight: 700; }
    header .marca p { margin: 1px 0 0; font-size: 11px; opacity: .85; }
    header .quien { font-size: 11px; opacity: .9; text-align: right; max-width: 45%; word-break: break-all; }

    nav {
      display: flex; gap: 4px; background: var(--azul); padding: 6px 8px;
      position: sticky; top: 0; z-index: 5; overflow-x: auto;
    }
    nav button {
      background: transparent; color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; opacity: .8;
    }
    nav button.activo { background: #fff; color: var(--azul-osc); opacity: 1; }

    /* 900px se quedaba corto en pantalla grande y, de paso, impedía que el
       simulador llegara nunca a sus dos columnas (su corte está en 900). */
    main { max-width: 1280px; margin: 0 auto; padding: 16px 20px; }
    @media (max-width: 700px) { main { padding: 12px; } }
    section[hidden] { display: none; }
    .panel { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .panel h2 { font-size: 15px; margin: 0 0 10px; color: var(--azul-osc); }
    .aviso { font-size: 12px; color: #5b6b73; margin-top: 8px; }
    .placeholder { text-align: center; color: #7c8b93; padding: 30px 10px; font-size: 14px; }

    /* Consultar */
    #arbol { max-height: 240px; overflow-y: auto; font-size: 14px; }
    .carpeta { margin-left: 4px; border-left: 2px solid var(--borde); padding-left: 8px; }
    .carpeta > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
    label.archivo { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
    label.archivo input { accent-color: var(--azul); }
    #seleccion { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 20px; }
    .chip { background: #e4f3fe; border: 1px solid var(--azul); color: var(--azul-osc); border-radius: 14px; padding: 3px 10px; font-size: 12px; }

    #mensajes { display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; margin-bottom: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
    .msg.user { background: var(--azul); color: #fff; align-self: flex-end; max-width: 85%; }
    .msg.bot { background: var(--fondo); border: 1px solid var(--borde); max-width: 92%; }
    .msg.error { background: #fdecea; border: 1px solid #f5b3ad; color: var(--err); }
    .fuentes { margin-top: 6px; font-size: 11px; opacity: .75; }
    .msg.pensando { display: flex; align-items: center; gap: 8px; color: #5b6b73; }
    .spinner { width: 15px; height: 15px; border: 2px solid var(--borde); border-top-color: var(--azul); border-radius: 50%; animation: giro .8s linear infinite; }
    @keyframes giro { to { transform: rotate(360deg); } }

    form.fila { display: flex; gap: 8px; }
    textarea, input[type="password"], input[type="text"] {
      flex: 1; resize: none; border: 1px solid var(--borde); border-radius: 8px;
      padding: 9px 11px; font-family: inherit; font-size: 14px;
    }
    textarea { min-height: 44px; }
    button.accion {
      background: var(--azul); color: #fff; border: none; border-radius: 8px;
      padding: 0 16px; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    button.accion.sec { background: #fff; color: var(--azul-osc); border: 1px solid var(--azul); }
    button.accion:disabled { opacity: .5; cursor: default; }
    .estado { font-size: 13px; margin-top: 8px; }
    .estado.ok { color: var(--ok); }
    .estado.err { color: var(--err); }

    /* Panel del profesorado */
    .umbrales { display: flex; gap: 10px; flex-wrap: wrap; }
    .umbrales label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5b6b73; flex: 1; min-width: 120px; }
    .umbrales input { border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 14px; }
    #prof-arbol { max-height: 300px; overflow-y: auto; font-size: 14px; }
    #prof-arbol label { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    #prof-arbol .tema > summary { display: flex; align-items: center; gap: 6px; }
    .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tabla th, .tabla td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--borde); }
    .tabla th { font-size: 11px; text-transform: uppercase; color: #5b6b73; font-weight: 600; }
    .tabla td.num { text-align: right; }
    .quieto { color: var(--err); font-weight: 600; }
    .parado { color: #a06000; font-weight: 600; }

    @media (max-width: 600px) {
      header .marca h1 { font-size: 15px; }
      main { padding: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">
      <h1>Portal de aprendizaje</h1>
      <p>Electromecánica de Vehículos · IES La Palma</p>
    </div>
    <div class="quien" id="quien">…</div>
  </header>

  <nav id="nav">
    <button data-sec="inicio" class="activo">Inicio</button>
    <button data-sec="consultar">Consultar</button>
    <button data-sec="apuntes">Apuntes</button>
    <button data-sec="manual">Manual</button>
    <button data-sec="juegos">Juegos</button>
    <button data-sec="simulador">Simulador</button>
    <button data-sec="cuenta">Mi cuenta</button>
    <button data-sec="profesor" id="nav-profesor" hidden>Panel</button>
  </nav>

  <main>
    <section id="sec-inicio"><?!= include('Inicio') ?></section>
    <section id="sec-consultar" hidden><?!= include('Consulta') ?></section>
    <section id="sec-apuntes" hidden><?!= include('Apuntes') ?></section>
    <section id="sec-manual" hidden><?!= include('Manual') ?></section>
    <section id="sec-juegos" hidden><?!= include('Juegos') ?></section>
    <section id="sec-simulador" hidden><?!= include('Simulador') ?></section>
    <section id="sec-cuenta" hidden><?!= include('Cuenta') ?></section>
    <section id="sec-profesor" hidden><?!= include('Profesor') ?></section>
  </main>

  <script>
    // ---------- Router ----------
    var seccionActual = 'inicio';
    var arbolCargado = false, cuentaCargada = false, panelCargado = false;

    function mostrar(sec) {
      seccionActual = sec;
      ['inicio', 'consultar', 'apuntes', 'manual', 'juegos', 'simulador', 'cuenta', 'profesor'].forEach(function (s) {
        document.getElementById('sec-' + s).hidden = (s !== sec);
      });
      Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) {
        b.classList.toggle('activo', b.getAttribute('data-sec') === sec);
      });
      if (sec === 'consultar' && !arbolCargado) cargarArbol();
      if (sec === 'consultar') refrescarGate();
      if (sec === 'manual') initManual();
      if (sec === 'cuenta' && !cuentaCargada) initCuenta();
      if (sec === 'apuntes') initApuntes();
      if (sec === 'inicio') { iniCargado = false; initInicio(); }
      if (sec === 'simulador') initSimulador();
      if (sec === 'profesor' && !panelCargado) initPanel();
    }
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) {
      b.addEventListener('click', function () { mostrar(b.getAttribute('data-sec')); });
    });

    // ---------- Identidad ----------
    google.script.run.withSuccessHandler(function (email) {
      document.getElementById('quien').textContent = email || 'invitado';
    }).usuarioActual();

    // Muestra la pestaña del panel solo si el usuario es profe.
    google.script.run.withSuccessHandler(function (ok) {
      if (ok) document.getElementById('nav-profesor').hidden = false;
    }).soyProfe();

    // Registra la conexión y cuenta tiempo conectado (latido cada 30 s).
    google.script.run.registrarConexion();
    setInterval(function () {
      if (!document.hidden) google.script.run.registrarLatido(30);
    }, 30000);

    // ---------- Consultar ----------
    var seleccionados = {}; // id -> nombre
    var checkboxes = {};    // id -> input (para desmarcar desde el chip)

    function quitarSeleccion(id) {
      delete seleccionados[id];
      if (checkboxes[id]) checkboxes[id].checked = false;
      actualizarChips();
    }

    function actualizarChips() {
      var cont = document.getElementById('seleccion');
      cont.innerHTML = '';
      Object.keys(seleccionados).forEach(function (id) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = seleccionados[id] + ' ';
        var x = document.createElement('span');
        x.textContent = '×';
        x.title = 'Quitar';
        x.setAttribute('role', 'button');
        x.style.cssText = 'cursor:pointer; font-weight:700; margin-left:2px;';
        x.addEventListener('click', function () { quitarSeleccion(id); });
        chip.appendChild(x);
        cont.appendChild(chip);
      });
    }

    function onToggle(id, nombre, checkbox) {
      if (checkbox.checked) {
        if (Object.keys(seleccionados).length >= 5) {
          alert('Máximo 5 PDF por pregunta.');
          checkbox.checked = false;
          return;
        }
        seleccionados[id] = nombre;
      } else {
        delete seleccionados[id];
      }
      actualizarChips();
    }

    function nodoArchivo(f) {
      var lab = document.createElement('label');
      lab.className = 'archivo';
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.addEventListener('change', function () { onToggle(f.id, f.name, chk); });
      checkboxes[f.id] = chk;
      lab.appendChild(chk);
      lab.appendChild(document.createTextNode(f.name));
      return lab;
    }

    function renderNodo(nodo) {
      var det = document.createElement('details');
      det.className = 'carpeta';
      var sum = document.createElement('summary');
      sum.textContent = nodo.name;
      det.appendChild(sum);
      nodo.files.forEach(function (f) { det.appendChild(nodoArchivo(f)); });
      nodo.children.forEach(function (h) { det.appendChild(renderNodo(h)); });
      return det;
    }

    function cargarArbol() {
      var cont = document.getElementById('arbol');
      cont.textContent = 'Cargando colección…';
      google.script.run
        .withSuccessHandler(function (raiz) {
          arbolCargado = true;
          cont.innerHTML = '';
          if (!raiz.children.length && !raiz.files.length) {
            cont.textContent = 'No hay PDF en la carpeta configurada todavía.';
            return;
          }
          raiz.children.forEach(function (h) { cont.appendChild(renderNodo(h)); });
          raiz.files.forEach(function (f) { cont.appendChild(nodoArchivo(f)); });
        })
        .withFailureHandler(function (err) { cont.textContent = 'Error al cargar la colección: ' + err.message; })
        .listarEstructura();
    }

    function addMsg(texto, tipo, fuentes) {
      var cont = document.getElementById('mensajes');
      var div = document.createElement('div');
      div.className = 'msg ' + tipo;
      div.textContent = texto;
      if (fuentes && fuentes.length) {
        var f = document.createElement('div');
        f.className = 'fuentes';
        f.textContent = 'Fuente: ' + fuentes.join(', ');
        div.appendChild(f);
      }
      cont.appendChild(div);
      cont.scrollTop = cont.scrollHeight;
    }

    function addPensando() {
      var cont = document.getElementById('mensajes');
      var div = document.createElement('div');
      div.className = 'msg bot pensando';
      var sp = document.createElement('span'); sp.className = 'spinner';
      var t = document.createElement('span'); t.textContent = 'Leyendo los PDF…';
      div.appendChild(sp); div.appendChild(t);
      cont.appendChild(div);
      cont.scrollTop = cont.scrollHeight;
      return div;
    }

    document.getElementById('form-pregunta').addEventListener('submit', function (e) {
      e.preventDefault();
      var campo = document.getElementById('pregunta');
      var pregunta = campo.value.trim();
      if (!pregunta) return;
      var ids = Object.keys(seleccionados);
      if (!ids.length) { alert('Selecciona al menos un PDF antes de preguntar.'); return; }

      addMsg(pregunta, 'user');
      campo.value = '';
      var btn = document.getElementById('btn-enviar');
      btn.disabled = true;
      var pensando = addPensando();
      google.script.run
        .withSuccessHandler(function (res) {
          pensando.remove();
          addMsg(res.respuesta, 'bot', res.fuentes);
          btn.disabled = false;
          if (res.estado) pintarGate(res.estado);
        })
        .withFailureHandler(function (err) { pensando.remove(); addMsg(err.message, 'error'); btn.disabled = false; })
        .preguntar(pregunta, ids);
    });

    // ---------- Participación (gating) ----------
    function pintarGate(est) {
      var g = document.getElementById('gate-info');
      if (!g) return;
      if (est.bloqueado) {
        g.textContent = '⛔ ' + est.mensaje;
        g.className = 'estado err';
      } else {
        g.textContent = 'Consultas: ' + est.consultas + '/' + est.permitidas + ' · te quedan ' + est.restantes + '.';
        g.className = 'estado ok';
      }
    }
    function refrescarGate() {
      google.script.run.withSuccessHandler(pintarGate).miEstado();
    }

    // ---------- Manual (tareas + aportar + valorar) ----------
    function initManual() {
      google.script.run.withSuccessHandler(function (est) {
        var e = document.getElementById('manual-estado');
        e.textContent = 'Aportaciones: ' + est.aportaciones + ' · valoraciones: ' + est.valoraciones +
          ' · consultas ' + est.consultas + '/' + est.permitidas +
          (est.bloqueado ? ' (bloqueado: ' + est.mensaje + ')' : '');
        e.className = 'estado ' + (est.bloqueado ? 'err' : 'ok');
      }).miEstado();
      cargarTareas();
      cargarValorar();
    }

    function cargarTareas() {
      google.script.run.withSuccessHandler(function (tareas) {
        var sel = document.getElementById('aporta-tarea');
        sel.innerHTML = '';
        if (!tareas.length) { sel.innerHTML = '<option value="">No hay tareas abiertas</option>'; return; }
        sel.appendChild(new Option('Elige una tarea…', ''));
        tareas.forEach(function (t) {
          var etiqueta = (t.entregada ? '✔ ' : '') + '[' + t.seccion + '] ' + t.enunciado;
          var op = new Option(etiqueta, t.tarea_id);
          op.disabled = t.entregada;   // una respuesta por ronda
          sel.appendChild(op);
        });
      }).tareasAbiertas();
    }

    document.getElementById('form-aporta').addEventListener('submit', function (e) {
      e.preventDefault();
      var tarea = document.getElementById('aporta-tarea').value;
      var texto = document.getElementById('aporta-texto').value.trim();
      var est = document.getElementById('aporta-estado');
      if (!tarea) { est.textContent = 'Elige una tarea.'; est.className = 'estado err'; return; }
      est.textContent = 'Enviando…'; est.className = 'estado';
      google.script.run
        .withSuccessHandler(function () {
          document.getElementById('aporta-texto').value = '';
          est.textContent = '✅ Respuesta enviada.'; est.className = 'estado ok';
          initManual();
        })
        .withFailureHandler(function (err) { est.textContent = err.message; est.className = 'estado err'; })
        .aportar(tarea, texto);
    });

    function cargarValorar() {
      var cont = document.getElementById('valorar-lista');
      cont.innerHTML = '<div class="placeholder">Cargando…</div>';
      google.script.run.withSuccessHandler(function (items) {
        cont.innerHTML = '';
        if (!items.length) { cont.innerHTML = '<div class="placeholder">No hay respuestas de otros por valorar ahora.</div>'; return; }
        items.forEach(function (it) {
          var card = document.createElement('div');
          card.style.cssText = 'border:1px solid var(--borde); border-radius:8px; padding:10px; margin-bottom:8px;';
          var q = document.createElement('div'); q.style.cssText = 'font-size:12px; color:#5b6b73; margin-bottom:4px;'; q.textContent = it.enunciado;
          var t = document.createElement('div'); t.style.cssText = 'font-size:14px; white-space:pre-wrap; margin-bottom:8px;'; t.textContent = it.texto;
          var fila = document.createElement('div'); fila.style.cssText = 'display:flex; gap:6px; align-items:center;';
          if (!it.pesos_libres.length) {
            var fin = document.createElement('span');
            fin.className = 'aviso';
            fin.textContent = 'Ya has repartido tus tres estrellas en esta ronda.';
            fila.appendChild(fin);
          } else {
            it.pesos_libres.forEach(function (peso) {
              var b = document.createElement('button');
              b.className = 'accion sec';
              b.type = 'button';
              b.textContent = peso + ' ★';
              b.addEventListener('click', function () {
                Array.prototype.forEach.call(fila.querySelectorAll('button'), function (x) { x.disabled = true; });
                google.script.run
                  .withSuccessHandler(function () { card.remove(); cargarValorar(); initManual(); })
                  .withFailureHandler(function (err) {
                    Array.prototype.forEach.call(fila.querySelectorAll('button'), function (x) { x.disabled = false; });
                    alert(err.message);
                  })
                  .valorar(it.aportacion_id, peso);
              });
              fila.appendChild(b);
            });
          }
          card.appendChild(q); card.appendChild(t); card.appendChild(fila);
          cont.appendChild(card);
        });
      }).aportacionesParaValorar();
    }


    // ---------- Mi cuenta (clave IA) ----------
    function pintaEstadoClave(tiene) {
      var e = document.getElementById('cuenta-estado');
      e.textContent = tiene ? 'Tienes una clave guardada.' : 'Aún no has guardado ninguna clave.';
      e.className = 'estado ' + (tiene ? 'ok' : 'err');
    }

    function initCuenta() {
      cuentaCargada = true;
      google.script.run.withSuccessHandler(pintaEstadoClave).tengoClaveIA();
    }

    document.getElementById('form-clave').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('clave');
      var clave = inp.value.trim();
      if (!clave) return;
      var e2 = document.getElementById('cuenta-estado');
      e2.textContent = 'Guardando…'; e2.className = 'estado';
      google.script.run
        .withSuccessHandler(function () { inp.value = ''; pintaEstadoClave(true); })
        .withFailureHandler(function (err) { e2.textContent = err.message; e2.className = 'estado err'; })
        .guardarClaveIA(clave);
    });

    document.getElementById('btn-comprobar').addEventListener('click', function () {
      var e = document.getElementById('cuenta-estado');
      e.textContent = 'Comprobando…'; e.className = 'estado';
      google.script.run
        .withSuccessHandler(function (r) {
          e.textContent = r.ok ? ('✅ La clave funciona (modelo ' + r.modelo + ')') : ('❌ ' + r.error);
          e.className = 'estado ' + (r.ok ? 'ok' : 'err');
        })
        .withFailureHandler(function (err) { e.textContent = err.message; e.className = 'estado err'; })
        .comprobarClaveIA();
    });

    document.getElementById('btn-borrar').addEventListener('click', function () {
      if (!confirm('¿Borrar tu clave guardada?')) return;
      google.script.run.withSuccessHandler(function () { pintaEstadoClave(false); }).borrarClaveIA();
    });

    // ---------- Panel del profesorado ----------
    var panelCfg = null;

    function fechaCorta(iso) {
      if (!iso) return '—';
      var dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (dias <= 0) return 'hoy';
      if (dias === 1) return 'ayer';
      return 'hace ' + dias + ' días';
    }

    function filaVisible(id, nombre, oculto, destino) {
      var lab = document.createElement('label');
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !oculto;
      chk.setAttribute('data-id', id);
      lab.appendChild(chk);
      lab.appendChild(document.createTextNode(nombre));
      destino.appendChild(lab);
      return chk;
    }

    function nodoPanel(nodo) {
      var det = document.createElement('details');
      det.className = 'carpeta tema';
      det.open = true;
      var sum = document.createElement('summary');
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !nodo.oculto;
      chk.setAttribute('data-id', nodo.id);
      chk.addEventListener('click', function (e) { e.stopPropagation(); });
      sum.appendChild(chk);
      sum.appendChild(document.createTextNode(nodo.name));
      det.appendChild(sum);
      nodo.files.forEach(function (f) { filaVisible(f.id, f.name, f.oculto, det); });
      nodo.children.forEach(function (h) { det.appendChild(nodoPanel(h)); });
      return det;
    }

    function pintarPulso(alumnos, gate) {
      var cont = document.getElementById('prof-pulso');
      if (!alumnos.length) { cont.textContent = 'Todavía no ha entrado nadie.'; return; }
      var t = document.createElement('table');
      t.className = 'tabla';
      t.innerHTML = '<tr><th>Alumno</th><th>Última vez</th><th>Cons.</th><th>Resp.</th><th>Valor.</th><th></th></tr>';
      alumnos.forEach(function (a) {
        var tr = document.createElement('tr');
        var dias = a.ultima_conexion
          ? Math.floor((Date.now() - new Date(a.ultima_conexion).getTime()) / 86400000) : 999;
        tr.innerHTML =
          '<td>' + a.usuario.split('@')[0] + '</td>' +
          '<td class="' + (dias >= 7 ? 'quieto' : '') + '">' + fechaCorta(a.ultima_conexion) + '</td>' +
          '<td class="num ' + (a.bloqueado ? 'parado' : '') + '">' + a.consultas + '/' + a.permitidas + '</td>' +
          '<td class="num">' + a.aportaciones + '</td>' +
          '<td class="num">' + a.valoraciones + '</td>' +
          '<td><button type="button" class="accion sec reiniciar" data-alumno="' +
             a.usuario + '">Nueva tanda</button></td>';
        t.appendChild(tr);
      });
      cont.innerHTML = '';
      cont.appendChild(t);
      Array.prototype.forEach.call(t.querySelectorAll('.reiniciar'), function (b) {
        b.addEventListener('click', function () {
          if (!confirm('¿Reiniciar los contadores de ' + b.dataset.alumno + '?')) return;
          b.disabled = true; b.textContent = '…';
          google.script.run
            .withSuccessHandler(function () { initPanel(); })
            .withFailureHandler(function (e) {
              b.disabled = false; b.textContent = 'Nueva tanda'; alert(e.message);
            })

    // ---------- Simulador de diagnóstico ----------
    // El motor es el mismo que se probó suelto; los casos vienen de la Hoja.
    var R_UCE = 2200;

    function banda(r) { return (r && typeof r === 'object' && r.min !== undefined) ? r : null; }
    function valorDe(r) { var b = banda(r); return b ? (b.min + b.max) / 2 : r; }

    /* --- Grafo con la avería aplicada --------------------------------------- */
    function tramosCon(averiaId, conectorPuesto) {
      var av = AVERIAS[averiaId] || AVERIAS.ninguna;
      var ef = av.efecto || {};
      var out = [];
      TRAMOS.forEach(function (t) {
        var r = valorDe(t.r);
        if (ef.tramo === t.de + '|' + t.a) r = ef.r;
        if (t.porConector === 'T4t' && !conectorPuesto) r = Infinity;  // conector fuera: tramo abierto
        out.push({ de: t.de, a: t.a, r: r, componente: t.componente, base: t });
      });
      return out;
    }

    /* --- Resistencia entre dos puntos (camino más corto por el grafo) -------- */
    function resistenciaEntre(a, b, tramos) {
      var mejor = Infinity;
      (function dfs(n, visit, acc) {
        if (acc === Infinity) return;
        if (n === b) { mejor = Math.min(mejor, acc); return; }
        tramos.forEach(function (t) {
          var sig = t.de === n ? t.a : (t.a === n ? t.de : null);
          if (!sig || visit.indexOf(sig) >= 0) return;
          dfs(sig, visit.concat([sig]), acc + t.r);
        });
      })(a, [a], 0);
      return mejor;
    }

    /* --- La medida ----------------------------------------------------------
       estado  = { contacto:'off'|'on'|'motor', conector:true|false }
       inst    = { funcion:'ohm'|'vdc', bornaRoja:'VΩ'|'mA'|'20A' }
       ------------------------------------------------------------------------ */
    function medir(puntoA, puntoB, inst, estado, averiaId) {
      var errores = [];
      var tramos = tramosCon(averiaId, estado.conector);

      /* Borna equivocada: esto en el taller funde el fusible del polímetro */
      if (inst.bornaRoja !== 'VΩ') {
        return {
          lectura: '---', unidad: '', veredicto: 'imposible',
          nota: 'Punta roja en la borna de ' + inst.bornaRoja + '. Para medir ' +
                (inst.funcion === 'ohm' ? 'resistencia' : 'tensión') +
                ' va en VΩ. Así has puesto el polímetro en serie: en el taller habrías fundido su fusible.'
        };
      }

      if (inst.funcion === 'ohm') {
        /* Condición de validez nº1: sin tensión en el circuito */
        if (estado.contacto !== 'off') {
          return {
            lectura: 'OL', unidad: 'Ω', veredicto: 'imposible',
            nota: 'Ohmios con el contacto dado. Con tensión presente la lectura no vale: ' +
                  'el polímetro mide inyectando su propia corriente. Quita el contacto.'
          };
        }
        var r = resistenciaEntre(puntoA, puntoB, tramos);

        /* Condición de validez nº2: el conector tiene que estar fuera */
        if (estado.conector) {
          var paralelo = (r === Infinity) ? R_UCE : (r * R_UCE) / (r + R_UCE);
          errores.push('conector_puesto');
          return {
            lectura: paralelo.toFixed(1), unidad: 'Ω', veredicto: 'invalida',
            nota: 'Has medido con el conector puesto: lo que lee el polímetro es la bobina ' +
                  'EN PARALELO con la electrónica de la UCE. El número parece razonable, pero no es la bobina.',
            errores: errores
          };
        }
        if (r === Infinity) {
          return { lectura: 'OL', unidad: 'Ω', veredicto: 'medida',
                   nota: 'Circuito abierto entre esos dos puntos.' };
        }
        return { lectura: r.toFixed(1), unidad: 'Ω', veredicto: 'medida' };
      }

      /* --- Tensión ---------------------------------------------------------- */
      if (estado.contacto === 'off') {
        return { lectura: '0.00', unidad: 'V', veredicto: 'medida',
                 nota: 'Sin contacto no hay tensión: no es una avería, es que el circuito está muerto.' };
      }
      if (!estado.conector) {
        return { lectura: '0.00', unidad: 'V', veredicto: 'invalida',
                 nota: 'Con el conector desconectado no circula corriente; medir tensión aquí no dice nada. ' +
                       'Para tensión, el conector va puesto.' };
      }
      var av = AVERIAS[averiaId] || AVERIAS.ninguna;
      var sinMando = !!(av.efecto && av.efecto.sinMando);
      var abierto = resistenciaEntre('N280:2', 'N280:1', tramos) === Infinity ||
                    resistenciaEntre('T4t/3', 'N280:2', tramos) === Infinity;
      var v = sinMando ? 0 : valorDe(ALIMENTACION);
      if (abierto && !sinMando) v = valorDe(ALIMENTACION);   // sin consumo, la tensión se mantiene
      return { lectura: v.toFixed(2), unidad: 'V', veredicto: 'medida' };
    }

    /* --- Veredicto de lo que ANOTA el alumno, por décadas --------------------
       No exige precisión: exige orden de magnitud. Es lo que distingue
       "no sé medir" de "he medido y el componente está mal".
       ------------------------------------------------------------------------ */
    function juzgar(anotado, prescrito) {
      var b = banda(prescrito);
      if (!b) return { clase: 'medida', et: 'Anotada' };
      var x = parseFloat(String(anotado).replace(',', '.'));
      if (!isFinite(x)) return { clase: 'medida', et: 'Anotada' };

      if (x >= b.min && x <= b.max) return { clase: 'ok', et: 'Dentro de rango' };

      var centro = (b.min + b.max) / 2;
      var decadas = Math.abs(Math.log10(Math.max(Math.abs(x), 1e-9) / centro));

      /* Tres décadas justas = confundir ohmios con kiloohmios. Error de escala,
         no de criterio: sabe qué mide, pero no ha leído bien el instrumento. */
      if (Math.abs(decadas - 3) <= 0.4) return { clase: 'escala', et: 'Escala o unidad equivocada',
        nota: 'Ese número encaja si cambias Ω por kΩ. Mira la escala del polímetro.' };

      /* Dos décadas o más: no está midiendo lo que cree. */
      if (decadas >= 2) return { clase: 'concepto', et: 'Orden de magnitud equivocado',
        nota: 'Te separan ' + decadas.toFixed(1) + ' décadas del valor esperado. Eso no es ese componente.' };

      /* Mismo orden, fuera de banda: la medida está bien hecha y el componente mal. */
      return { clase: 'fuera', et: 'Fuera de especificación',
        nota: 'El orden es correcto, así que la medida está bien hecha: el que está mal es el componente. Esto puede ser el hallazgo.' };
    }


    var simM = null, simEstado = {contacto:'off',conector:true}, simInst = {funcion:'off',bornaRoja:'VΩ'};

    /* Dibuja el circuito a partir de los puntos del caso, en dos columnas:
       la UCE arriba, el conector en medio y el componente abajo. */
    function simEsquema(){
      var on=simEstado.conector;
      var ids=Object.keys(NODOS);
      var izq=[], der=[];
      ids.forEach(function(id,i){ (i%2===0?izq:der).push(id); });
      function pin(id,x,y,et){
        var c=simSel.A===id?'A':(simSel.B===id?'B':'');
        return '<g><circle class="pin '+c+'" data-pin="'+id+'" cx="'+x+'" cy="'+y+'" r="8"></circle>'
             + '<text class="etp" x="'+x+'" y="'+(y-13)+'">'+et+'</text></g>';
      }
      var ys=[90,186,252], h='<svg class="esq" viewBox="0 0 620 330">';
      h+='<rect class="caja" x="40" y="20" width="240" height="46" rx="5"/>'
       + '<text class="et" x="160" y="48">'+(izq[0]||'').split(':')[0]+'</text>'
       + '<path class="cbl" d="M100 66 V82"/><path class="cbl" d="M220 66 V82"/>'
       + '<path class="cbl" d="M100 98 V145"/><path class="cbl" d="M220 98 V145"/>'
       + '<g class="conector '+(on?'':'off')+'" data-con="1">'
       +   '<rect class="hit" x="56" y="138" width="208" height="42" rx="8"/>'
       +   '<rect x="72" y="145" width="56" height="26" rx="4"/>'
       +   '<rect x="192" y="145" width="56" height="26" rx="4"/>'
       + '</g>'
       + '<path class="cbl'+(on?'':' off')+'" d="M100 194 V245"/>'
       + '<path class="cbl'+(on?'':' off')+'" d="M220 194 V245"/>'
       + '<rect class="caja" x="60" y="268" width="200" height="44" rx="5"/>'
       + '<text class="et" x="160" y="295">'+(izq[2]||'').split(':')[0]+'</text>'
       + '<text class="etp" x="470" y="60">Conector '+(on?'CONECTADO':'DESCONECTADO')+'</text>';
      for(var k=0;k<3;k++){
        if(izq[k]) h+=pin(izq[k],100,ys[k],NODOS[izq[k]].et);
        if(der[k]) h+=pin(der[k],220,ys[k],NODOS[der[k]].et);
      }
      h+='</svg>';
      document.getElementById('sim-esquema').innerHTML=h;
      document.getElementById('sim-estcon').innerHTML='Conector: <strong>'+(on?'conectado':'desconectado')+'</strong>';
      document.querySelectorAll('#sim-esquema [data-pin]').forEach(function(el){
        el.addEventListener('click',function(){ simTocar(el.dataset.pin); });
      });
      document.querySelector('#sim-esquema [data-con]').addEventListener('click',function(){
        simEstado.conector=!simEstado.conector; simEsquema(); simRefresca();
      });
    }

    function simTocar(id){
      if(simSel.A===id) simSel.A=null;
      else if(simSel.B===id) simSel.B=null;
      else if(!simSel.A) simSel.A=id;
      else if(!simSel.B) simSel.B=id;
      else { simSel.A=id; simSel.B=null; }
      simEsquema(); simRefresca();
    }
    function simRefresca(){

    }

    document.getElementById('sim-medir').addEventListener('click',function(){
      var r=medir(simSel.A,simSel.B,simInst,simEstado,simM.caso.averiaActiva);
      simUlt=r;
      document.getElementById('sim-disp').textContent=r.lectura+(r.unidad?' '+r.unidad:'');

      n.innerHTML=r.nota||'Lectura tomada. Anótala en la ficha.';

      if(puede){

    document.getElementById('sim-anota').addEventListener('click',function(){
      if(!simUlt) return;
      var val=document.getElementById('sim-val').value.trim();
      var uni=document.getElementById('sim-uni').value;
      var esOhm=simInst.funcion==='ohm';
      var pres=esOhm?simBanda():ALIMENTACION;
      var x=parseFloat(val.replace(',','.'));
      if(uni==='kΩ'&&isFinite(x)) x=x*1000;
      if(uni==='mV'&&isFinite(x)) x=x/1000;
      var j=isFinite(x)?juzgar(x,pres):{clase:'medida',et:'Anotada'};
      if(simUlt.veredicto==='invalida') j={clase:'concepto',et:'Medida no válida',
        nota:'La lectura no vale por cómo se ha tomado, aunque el número lo parezca.'};
      simN++;
      var tr=document.getElementById('sim-ficha').insertRow(-1); tr.className=j.clase;
      tr.innerHTML='<td>'+simN+'</td><td>'+(esOhm?'Ω':(simInst.funcion==='vdc'?'V⎓':'A'))+'</td>'
        +'<td>'+NODOS[simSel.A].et+'</td><td>'+NODOS[simSel.B].et+'</td>'
        +'<td>'+(simEstado.conector?'ON':'OFF')+'</td>'
        +'<td>'+({off:'Sin contacto',on:'Contacto',motor:'Motor ON'})[simEstado.contacto]+'</td>'
        +'<td>'+simPres(pres)+'</td><td>'+val+' '+uni+'</td>'
        +'<td class="vd '+j.clase+'">'+j.et+'</td>';
      document.getElementById('sim-fvacio').style.display='none';
      if(simUlt.veredicto === 'medida') simValidas++;
      if(j.nota){ var n=document.getElementById('sim-nota');
        n.className='nota v '+(j.clase==='ok'?'ok':(j.clase==='fuera'?'invalida':'imposible'));
        n.innerHTML=j.nota; }
      document.getElementById('sim-anotar').style.display='none';
    });

    /* La causa correcta se deduce de la avería inyectada: si el tramo cortado
       lleva componente, el culpable es ese componente; si es un cable, es el
       cableado; si la UCE no da mando, es el circuito de mando. */
    function simCausaReal(){
      var av = AVERIAS[simM.caso.averiaActiva];
      if(!av || !av.efecto) return 'correcto';
      if(av.efecto.sinMando) return 'uce';
      var t = TRAMOS.filter(function(x){ return x.de+'|'+x.a === av.efecto.tramo; })[0];
      return (t && t.componente) ? t.componente : 'cableado';
    }

    function simOpcionesDx(){
      var sel = document.getElementById('sim-dx');
      sel.innerHTML = '<option value="">Elige la causa…</option>';
      var vistos = {};
      TRAMOS.forEach(function(t){
        if(t.componente && !vistos[t.componente]){
          vistos[t.componente] = true;
          sel.innerHTML += '<option value="'+t.componente+'">'+t.componente+'</option>';
        }
      });
      sel.innerHTML += '<option value="cableado">Cableado o conector</option>'
        + '<option value="uce">Circuito de mando / unidad de control</option>'
        + '<option value="correcto">El sistema está correcto</option>';
      document.getElementById('sim-emitir').disabled = true;
      document.getElementById('sim-veredicto').className = 'nota';
      sel.onchange = function(){
        document.getElementById('sim-emitir').disabled = !sel.value;
      };
    }

    document.getElementById('sim-emitir').addEventListener('click', function(){
      var elegido = document.getElementById('sim-dx').value;
      if(!elegido || !simM) return;
      var real = simCausaReal();
      var acertado = (elegido === real);
      // Fundamentado = lo sostuvo con comprobaciones válidas. Acertar sin medir
      // es suerte, y como suerte no desbloquea nada.
      var fundamentado = acertado && simValidas > 0;

      var v = document.getElementById('sim-veredicto');
      v.className = 'nota v ' + (fundamentado ? 'ok' : (acertado ? 'invalida' : 'imposible'));
      v.innerHTML = fundamentado
        ? '<strong>✔ Correcto y fundamentado.</strong> Lo comprobaste antes de decidir.'
        : (acertado
            ? '<strong>◑ Acertaste, pero sin fundamento.</strong> No hiciste ninguna '
              + 'comprobación válida: eso es suerte, no diagnóstico. Este caso sigue pendiente.'
            : '<strong>✘ No es ahí.</strong> La avería estaba en: <strong>' + real + '</strong>.');

      document.getElementById('sim-emitir').disabled = true;
      simRegistrar(acertado, fundamentado);
    });

    function simRegistrar(acertado, fundamentado){
      if(!simM || !simM.caso) return;
      google.script.run
        .withSuccessHandler(function(){ iniCargado = false; })
        .withFailureHandler(function(){ /* no romper la práctica por esto */ })
        .registrarIntento({
          casoId: simM.caso.id,
          acertado: !!acertado,
          fundamentado: !!fundamentado,
          segundos: Math.round((Date.now() - simDesde)/1000)
        });
    }

    function simBanda(){
      var t=TRAMOS.filter(function(x){return x.componente;})[0];
      return t?t.r:null;
    }
    function simPres(p){
      if(!p||p.min===undefined||p.min===null) return '—';
      return p.min+'–'+p.max+' '+p.unidad+' <span class="origen">'+p.origen+'</span>';
    }


    // ---------- Apuntes: las notas técnicas ----------
    // Leer no gasta consultas. Si no hay libros, esto es el libro.
    var apCorpus = null, apCargado = false;

    function initApuntes(){
      if(apCargado) return;
      apCargado = true;
      document.getElementById('ap-resumen').textContent = 'Cargando apuntes…';
      google.script.run
        .withSuccessHandler(function(d){ apCorpus = d; pintarApuntes(); })
        .withFailureHandler(function(e){
          apCargado = false;
          document.getElementById('ap-resumen').textContent = e.message;
        })
        .listarNotas();
    }

    function pintarApuntes(){
      var sel = document.getElementById('ap-grupo');
      if(sel.options.length <= 1){
        apCorpus.grupos.forEach(function(g){
          var o=document.createElement('option'); o.value=g; o.textContent=g; sel.appendChild(o);
        });
      }
      var leidas = apCorpus.notas.filter(function(n){return n.leida;}).length;
      document.getElementById('ap-resumen').textContent =
        apCorpus.total + ' notas · has leído ' + leidas +
        ' · actualizadas el ' + apCorpus.generado;
      filtrarApuntes();
    }

    function filtrarApuntes(){
      var q = (document.getElementById('ap-buscar').value||'').toLowerCase().trim();
      var g = document.getElementById('ap-grupo').value;
      var f = document.getElementById('ap-filtro').value;
      var cont = document.getElementById('ap-resultados');
      cont.innerHTML = '';
      var n = 0;
      apCorpus.notas.forEach(function(x){
        if(g && x.grupo !== g) return;
        if(f === 'si' && !x.leida) return;
        if(f === 'no' && x.leida) return;
        if(q){
          var heno = (x.titulo+' '+x.codigo+' '+x.grupo+' '+x.menu).toLowerCase();
          if(heno.indexOf(q) < 0) return;
        }
        n++;
        var b = document.createElement('button');
        b.className = 'nt' + (x.leida?' leida':'');
        b.innerHTML = '<span class="num">NT'+x.nt+'</span>'
          + '<span class="tit">'+x.titulo
          + '<small><span class="chip'+(x.tipo==='proceso'?' proceso':'')+'">'
          + (x.tipo==='proceso'?(x.subtipo||'proceso'):'elemento')+'</span> '+x.grupo+'</small></span>'
          + (x.leida?'<span class="ok">✓ leída</span>':'');
        b.addEventListener('click', function(){ abrirNota(x.nt); });
        cont.appendChild(b);
      });
      if(!n) cont.innerHTML = '<p class="vacio">Nada con ese filtro.</p>';
    }

    ['ap-buscar','ap-grupo','ap-filtro'].forEach(function(id){
      document.getElementById(id).addEventListener('input', function(){ if(apCorpus) filtrarApuntes(); });
    });
    document.getElementById('ap-volver').addEventListener('click', function(){
      document.getElementById('ap-lector').hidden = true;
      document.getElementById('ap-lista').hidden = false;
    });

    function abrirNota(nt){
      var d = document.getElementById('ap-nota');
      d.innerHTML = '<p class="vacio">Abriendo NT'+nt+'…</p>';
      document.getElementById('ap-lista').hidden = true;
      document.getElementById('ap-lector').hidden = false;
      google.script.run
        .withSuccessHandler(function(n){
          var h = '<h2>NT'+n.nt+' · '+n.titulo+(n.codigo?' — '+n.codigo:'')+'</h2>';
          if(n.ubicacion) h += '<p class="aviso"><strong>Ubicación:</strong> '+n.ubicacion+'</p>';
          n.apartados.forEach(function(a){
            h += '<div class="apartado"><h4>'+a.titulo+'</h4><p>'+a.texto+'</p></div>';
          });
          if(n.fuentes) h += '<p class="fuente"><strong>Fuente:</strong> '+n.fuentes+'</p>';
          d.innerHTML = h;
          // queda marcada como leída en el servidor; refrescamos el listado
          var x = apCorpus && apCorpus.notas.filter(function(y){return y.nt===n.nt;})[0];
          if(x && !x.leida){ x.leida = true; pintarApuntes(); }
        })
        .withFailureHandler(function(e){ d.innerHTML = '<p class="vacio">'+e.message+'</p>'; })
        .cargarNota(nt);
    }

    // ---------- Inicio: por dónde vas ----------
    var iniCargado = false;

    function initInicio(){
      if(iniCargado) return;
      iniCargado = true;
      google.script.run
        .withSuccessHandler(pintarInicio)
        .withFailureHandler(function(e){
          iniCargado = false;
          document.getElementById('ini-sub').textContent = e.message;
        })
        .miProgreso();
    }

    function pintarInicio(p){
      var nombre = (p.usuario||'').split('@')[0].replace(/[._]/g,' ');
      document.getElementById('ini-saludo').textContent = 'Hola, ' + nombre;
      document.getElementById('ini-leidas').textContent = p.leidas;
      document.getElementById('ini-casos').textContent = p.casosResueltos + '/' + p.casosTotales;
      document.getElementById('ini-intentos').textContent = p.intentos;

      var total = (apCorpus && apCorpus.total) || 0;
      var pct = total ? Math.round(p.leidas/total*100) : 0;
      document.getElementById('ini-barra').style.width = pct + '%';
      document.getElementById('ini-barra-txt').textContent = total
        ? ('Llevas ' + p.leidas + ' de ' + total + ' notas (' + pct + '%).')
        : ('Llevas ' + p.leidas + ' notas leídas.');

      document.getElementById('ini-sub').textContent = p.leidas === 0 && p.intentos === 0
        ? 'Es tu primera vez por aquí. Empieza por los apuntes, sin prisa.'
        : 'Esto es lo que llevas. Sigue por donde lo dejaste.';

      var txt = document.getElementById('ini-siguiente-txt');
      var btn = document.getElementById('ini-ir');
      if(p.siguiente){
        txt.textContent = 'Tienes un caso esperándote: «' + p.siguiente.titulo + '».';
        btn.hidden = false;
        btn.onclick = function(){ mostrar('simulador'); };
      } else if(p.casosTotales && p.casosResueltos >= p.casosTotales){
        txt.textContent = 'Has resuelto todos los casos con fundamento. Repasa apuntes o espera a que haya casos nuevos.';
        btn.hidden = true;
      } else {
        document.getElementById('ini-siguiente').className = 'siguiente espera';
        txt.textContent = 'Ahora mismo no hay ningún caso abierto para ti: entre intento e intento pasan ' +
          p.horasEntreIntentos + ' horas. Aprovecha y lee apuntes.';
        btn.hidden = false;
        btn.textContent = 'Ir a los apuntes';
        btn.onclick = function(){ mostrar('apuntes'); };
      }
    }

  </script>
</body>
</html>
