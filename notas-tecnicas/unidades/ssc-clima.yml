# Unidad didáctica: Climatización (módulo SSC)
#
# Solo lo propio de esta unidad. Los apartados comunes (misión, principio de
# funcionamiento, características, comprobación…) se heredan de
# curriculo/ssc.yml y NO se repiten aquí.

modulo: ssc
unidad: clima
nombre: Climatización
orden: 1
icono: ❄️
color: '#0a63aa'
horas: 40
descripcion: 'El circuito frigorífico de arriba abajo: qué hace cada pieza, qué valores tiene que
  dar y cómo se diagnostica cuando no enfría.'

# NotebookLM tiene tope de fuentes, así que la unidad se reparte en varios
# cuadernos. Cada uno genera su tanda de notas y luego se vacía.
cuadernos:
  - nombre: clima-1-circuito
    contenido: componentes del circuito frigorífico
  - nombre: clima-2-sensores
    contenido: sensores, presostatos y actuadores
  - nombre: clima-3-regulacion
    contenido: regulación, control y climatizador electrónico
  - nombre: clima-4-taller
    contenido: procedimientos de taller, carga, vacío, diagnóstico

# Lo propio de clima: los fluidos (1c y 1d) y el mantenimiento del sistema de
# temperatura del habitáculo (RA3 entero). Los apartados comunes ya cubren
# misión, funcionamiento y comprobación.
apartados_propios:
  elemento:
    - apartado: Fluidos y normativa
      criterios: [1c, 1d]
      despues_de: Características
      pide: >-
        Qué refrigerante y qué aceite admite, sus propiedades, incompatibilidades
        y la normativa de manejo y almacenamiento que le aplica. Solo si la
        fuente habla de ello para este elemento.
  proceso:
    - apartado: Carga, recuperación y fugas
      criterios: [3e, 3f, 3g]
      despues_de: Desarrollo
      pide: >-
        Cantidad de refrigerante y de lubricante, uso de la estación de carga,
        recuperación, y colorante para detectar fugas, si el procedimiento lo
        trata.

# ───────────────────────────────────────────────────────────────────────────
# GUION DEL CURSO — LO ESCRIBES TÚ (orden de aprendizaje)
#
# Cada sección es una lección. Debajo, las ENTIDADES (el campo 'entidad' del
# YAML de cada nota) en el orden en que quieres que el alumno las vea.
# - Una entidad junta todas sus notas: variantes (compresor de paletas,
#   espiral…) y fuentes distintas salen como pestañas dentro de ella.
# - Lo que no esté aquí sale al final en «Por ubicar» y se lista en
#   unidades/_sin_colocar.yml tras cada generación: copia de ahí.
# - Esto no lo toca ningún script. Reprocesar un PDF no cambia el orden.
#
# Borrador con los nombres del prompt v2: reordena, mueve o borra a tu gusto.
# ───────────────────────────────────────────────────────────────────────────

indice:
  - seccion: 1. Impacto ambiental y normativa
    claves:
      - efecto-invernadero-y-cambio-climatico
      - agotamiento-capa-ozono
      - potencial-agotamiento-ozono
      - potencial-calentamiento-atmosferico
      - protocolo-montreal
      - protocolo-kioto
      - reglamento-ce-1005-2009
      - directiva-2006-40-ce
      - reglamento-ue-517-2014
      - certificacion-manipulacion-gases-fluorados

  - seccion: 2. Fundamentos
    claves:
      - higrometria-y-confort
      - ciclo-frigorifico

  - seccion: 3. Fluidos
    claves:
      - refrigerante-r134a
      - refrigerante-r1234yf
      - aceite-frigorifico
      - trazador-uv

  - seccion: 4. El compresor
    claves:
      - compresor
      - embrague-compresor
      - polea-dumper
      - plato-valvulas
      - disco-oscilante
      - pistones-embolos
      - valvula-sobrepresion
      - fusible-mecanico-compresor
      # valvula-reguladora-compresor-variable: se estudia en la sección 7.
      # Mecánica y electrónica PWM salen solas como pestañas (campo variante).

  - seccion: 5. Lado de alta
    claves:
      - condensador
      - electroventilador-condensador
      - filtro-deshidratador-mirilla

  - seccion: 6. Expansión y lado de baja
    claves:
      - grupo: Dispositivos de expansión
        claves:
          - valvula-expansion
          - estrangulador-orifico-calibrado
      - evaporador
      - deposito-colector
      - tuberias-y-racores

  - seccion: 7. Sensores y actuadores
    claves:
      - presostato-binary-trinary-cuatrinary
      - transmisor-presion-map-maf
      - sensor-temperatura-ntc-exterior
      - sensor-temperatura-ntc-interior
      - sensor-ntc-evaporador
      - sensor-humedad
      - sensor-calidad-aire
      - fotosensor-solar
      - servomotor-trampilla
      - ventilador-habitaculo
      - valvula-reguladora-compresor-variable

  - seccion: 8. Regulación y control
    claves:
      - unidad-control-climatizador
      - regulacion-automatica
      - distribucion-aire
      - recirculacion

  - seccion: "9. Taller: recuperación, vacío y carga"
    claves:
      - etiqueta-identificativa-climatizacion
      - recuperacion-refrigerante
      - extraccion-medicion-aceite
      - vacio-circuito
      - introduccion-aceite-circuito
      - carga-refrigerante
      - deteccion-fugas
      - lavado-circuito
      - limpieza-evaporador

  - seccion: 10. Diagnóstico
    claves:
      - lectura-manometros
      - comprobacion-rendimiento-climatizador
      - no-enfria
      - diagnostico-averias-hidraulicas
      - diagnostico-compresor
      - sustitucion-compresor
      - autodiagnostico-climatizador

  - seccion: 11. Equipos de taller
    claves:
      - preparacion-estacion-carga
      - llenado-bombona-estacion-carga
      - reciclado-interno-estacion-carga
      - desconexion-equipo-carga

# ───────────────────────────────────────────────────────────────────────────
# ALIAS — nombres distintos de la MISMA cosa.  otro-nombre: el-tuyo
# NotebookLM no siempre escribe la entidad igual en cada PDF. Aquí la juntas
# con la tuya sin tocar las notas. Mira unidades/_sin_colocar.yml tras cada
# lote: lo que sea un duplicado de algo que ya tienes, va aquí.
# ───────────────────────────────────────────────────────────────────────────

alias:
  filtro-deshidratador: filtro-deshidratador-mirilla
  mirilla: filtro-deshidratador-mirilla
  valvula-reguladora-compresor: valvula-reguladora-compresor-variable
  presostato: presostato-binary-trinary-cuatrinary
  transmisor-presion: transmisor-presion-map-maf
  sensor-temperatura-exterior: sensor-temperatura-ntc-exterior
  sensor-temperatura-interior: sensor-temperatura-ntc-interior
  sensor-evaporador: sensor-ntc-evaporador
  efecto-invernadero-cambio-climatico: efecto-invernadero-y-cambio-climatico
  directiva-2006-40-ce-mac: directiva-2006-40-ce
  reglamento-1005-2009-sao: reglamento-ce-1005-2009
  reglamento-517-2014-f-gas: reglamento-ue-517-2014
  estrangulador: estrangulador-orifico-calibrado
