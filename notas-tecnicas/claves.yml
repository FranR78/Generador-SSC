# Qué notas hablan del mismo componente
#
# Cuatro manuales distintos llaman de cuatro formas a la misma pieza. El
# dashboard agrupa por 'clave', y la clave sale del título, así que
# "Compresor de aire acondicionado" y "Compresor De Climatización" acaban en
# dos sitios distintos siendo lo mismo.
#
# Aquí se dice cuáles son la misma cosa. A la izquierda, el nombre con el que
# se quiere que aparezca el grupo. Debajo, los títulos que significan eso.
#
#   compresor:
#     - Compresor de aire acondicionado
#     - Compresor De Climatización
#
# Reglas:
#   - Agrupa, NO fusiona. Las cuatro notas siguen enteras, cada una con su
#     fabricante y su fuente. Solo se ponen juntas.
#   - No hace falta respetar mayúsculas ni tildes.
#   - Un título solo puede estar en un grupo. Si se repite, construir.py avisa
#     y no genera nada.
#   - Si una nota concreta se resiste, se le pone 'clave: loquesea' en su
#     propio archivo y eso manda sobre esta tabla.
#   - Lo que no esté aquí, se agrupa solo por título idéntico, como siempre.
#
# Al ejecutar construir.py, al final salen los candidatos que ha detectado y
# no están todavía en esta tabla, ya escritos para pegarlos aquí.

